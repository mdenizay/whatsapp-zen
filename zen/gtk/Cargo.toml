[package]
name = "zen-gtk"
description = "WhatsApp Zen for Linux: a light, native WhatsApp client (unofficial)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage = "https://github.com/mdenizay/whatsapp-zen"

[[bin]]
name = "whatsapp-zen"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
base64 = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zen-core = { path = "../core" }

# `cargo deb -p zen-gtk` builds the Debian/Ubuntu package.
[package.metadata.deb]
name = "whatsapp-zen"
maintainer = "Mehmet Deniz Aydın"
section = "net"
depends = "libgtk-4-1 (>= 4.12), libadwaita-1-0 (>= 1.5), libasound2t64 | libasound2"
assets = [
    ["target/release/whatsapp-zen", "usr/bin/", "755"],
    ["data/io.github.mdenizay.WhatsAppZen.desktop", "usr/share/applications/", "644"],
    ["data/io.github.mdenizay.WhatsAppZen.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]
