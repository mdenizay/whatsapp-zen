# Builds WhatsApp Zen for Windows: the Rust core as zen_core.dll and the
# WinUI 3 app in zen/windows, published as one self-contained folder. When
# started for a tag it publishes a zip of that folder as a pre-release, which
# stays out of /releases/latest (read by the macOS app's updater).
name: Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to, e.g. windows-v0.1.0 (empty: build only)"
        required: false
  pull_request:
    paths: ["zen/**", ".github/workflows/windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zen

      - name: Core (zen_core.dll)
        working-directory: zen
        env: { LIBOPUS_STATIC: "1", LIBOPUS_NO_PKG: "1", CMAKE_POLICY_VERSION_MINIMUM: "3.5" }
        run: cargo rustc --release -p zen-core --lib --crate-type cdylib

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: App
        working-directory: zen/windows
        run: dotnet publish WhatsAppZen.csproj -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Package
        shell: pwsh
        working-directory: zen/windows
        run: |
          [xml]$project = Get-Content WhatsAppZen.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          Copy-Item README-windows.md publish/README.md
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "dist/WhatsApp-Zen-$version-windows-x64.zip"
          Get-ChildItem dist

      # Nobody has a Windows machine at hand while this is developed: start
      # the app, make sure it stays up, and keep a picture of what it shows.
      - name: Smoke test
        shell: pwsh
        working-directory: zen/windows
        run: |
          $env:ZEN_DATA = Join-Path $env:RUNNER_TEMP "zen-data"
          $app = Start-Process -FilePath publish/WhatsAppZen.exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("dist/smoke.png")
          if ($app.HasExited) {
            Write-Host "The app exited with code $($app.ExitCode)"
            Get-WinEvent -LogName Application -MaxEvents 20 | Where-Object { $_.Message -match "WhatsAppZen" } | Select-Object -First 3 | Format-List TimeCreated, Message
            exit 1
          }
          Write-Host "The app is running (window title: '$((Get-Process -Id $app.Id).MainWindowTitle)')"
          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-zen-windows
          path: |
            zen/windows/dist/*.zip
            zen/windows/dist/smoke.png

      - name: Publish
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --prerelease --title "WhatsApp Zen for Windows ${{ inputs.tag }}" --notes-file zen/windows/README-windows.md
          gh release upload "${{ inputs.tag }}" zen/windows/dist/*.zip --clobber
