# Builds WhatsApp Zen for Linux (zen/gtk) and, when started for a tag,
# publishes it as a pre-release: a .deb for Debian and Ubuntu, and a tarball
# for everything else. Pre-releases stay out of /releases/latest, which the
# macOS app's updater reads.
name: Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to, e.g. linux-v0.1.0 (empty: build only)"
        required: false
  pull_request:
    paths: ["zen/**", ".github/workflows/linux.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libasound2-dev cmake pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zen

      - name: Test
        working-directory: zen
        env: { LIBOPUS_STATIC: "1", LIBOPUS_NO_PKG: "1", CMAKE_POLICY_VERSION_MINIMUM: "3.5" }
        run: cargo test -p zen-gtk -p zen-core --lib

      - name: Build
        working-directory: zen
        env: { LIBOPUS_STATIC: "1", LIBOPUS_NO_PKG: "1", CMAKE_POLICY_VERSION_MINIMUM: "3.5" }
        run: cargo build --release -p zen-gtk

      - name: Package
        working-directory: zen
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="zen-gtk"][0])')"
          cargo install cargo-deb --locked
          cargo deb -p zen-gtk --no-build --output "dist/whatsapp-zen_${VERSION}_amd64.deb"
          mkdir -p "dist/whatsapp-zen-$VERSION"
          cp target/release/whatsapp-zen gtk/data/io.github.mdenizay.WhatsAppZen.desktop gtk/data/io.github.mdenizay.WhatsAppZen.png "dist/whatsapp-zen-$VERSION/"
          cp gtk/README-linux.md "dist/whatsapp-zen-$VERSION/README.md"
          tar -C dist -czf "dist/whatsapp-zen-$VERSION-linux-x86_64.tar.gz" "whatsapp-zen-$VERSION"
          ls -la dist

      # Install the package as a user would, start the app on a virtual
      # display and keep a picture of its window.
      - name: Smoke test
        working-directory: zen
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/*.deb xvfb adwaita-icon-theme fonts-cantarell
          ZEN_DATA="$RUNNER_TEMP/zen-data" ZEN_SNAPSHOT="$PWD/dist/smoke.png" GSK_RENDERER=cairo \
            timeout 60 xvfb-run -a -s "-screen 0 1280x800x24" whatsapp-zen
          test -s dist/smoke.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-zen-linux
          path: |
            zen/dist/*.deb
            zen/dist/*.tar.gz
            zen/dist/smoke.png

      - name: Publish
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --prerelease --title "WhatsApp Zen for Linux ${{ inputs.tag }}" --notes-file zen/gtk/RELEASE-NOTES.md
          gh release upload "${{ inputs.tag }}" zen/dist/*.deb zen/dist/*.tar.gz --clobber
